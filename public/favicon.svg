  <!-- Highlights -->
  <ellipse cx="23" cy="23" rx="5" ry="3.5" fill="rgba(255,255,255,0.08)"/>
  <ellipse cx="59" cy="23" rx="5" ry="3.5" fill="rgba(255,255,255,0.08)"/>
  <ellipse cx="95" cy="23" rx="5" ry="3.5" fill="rgba(255,255,255,0.08)"/>
